<!doctype html>
<meta charset="utf-8">
<title>FlightWifi blog thumbnails</title>
<style>
  html, body { margin: 0; background: #fff; }
  .scene { width: 1200px; height: 760px; display: none; }
  .scene.on { display: block; }
  svg { display: block; width: 1200px; height: 760px; }
  text { font-family: -apple-system, "Inter", system-ui, sans-serif; }
</style>

<svg class="scene" data-scene="defs" viewBox="0 0 1200 760" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6e7f8"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#ebe6dd"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fe8"/>
      <stop offset="1" stop-color="#0f47c0"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2f6e"/>
      <stop offset="1" stop-color="#0d1a44"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef1f6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfeeff"/>
      <stop offset="1" stop-color="#c3dcff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <symbol id="plane" viewBox="-120 -120 240 240">
      <ellipse cx="0" cy="62" rx="70" ry="10" fill="#0b1a3a" opacity=".16" filter="url(#soft)"/>
      <path d="M-6-104c8-8 16 0 16 12v42l86 46v16l-86-24v40l24 16v12l-34-8-34 8v-12l24-16v-40l-86 24v-16l86-46v-42c0-12 8-20 14-12z" fill="url(#white)" stroke="#c9d3e3" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-4-62h8v70h-8z" fill="#dfe6f2"/>
      <circle cx="0" cy="-70" r="7" fill="#9fc0ff"/>
      <path d="M-40 34l-6 6v10l6-2zM40 34l6 6v10l-6-2z" fill="#1a5fdf"/>
    </symbol>
    <symbol id="wifi" viewBox="0 0 100 80">
      <path d="M10 34a56 56 0 0 1 80 0" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
      <path d="M24 48a36 36 0 0 1 52 0" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
      <path d="M38 61a17 17 0 0 1 24 0" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/>
      <circle cx="50" cy="72" r="6" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<script>
  const want = new URLSearchParams(location.search).get("scene");
  document.querySelectorAll(".scene").forEach((s) => {
    if (s.dataset.scene === "defs" || s.dataset.scene === want) s.classList.add("on");
  });
  const defs = document.querySelector('[data-scene="defs"]');
  defs.style.position = "absolute";
  defs.style.width = "0";
  defs.style.height = "0";
</script>
