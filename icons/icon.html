<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #tile {
    width: 128px;
    height: 128px;
    border-radius: 26px;
    background: linear-gradient(160deg, #1a73e8 0%, #0b57d0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { width: 84px; height: 84px; }
</style>
</head>
<body>
<div id="tile">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path fill="#fff" d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4l2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
  </svg>
</div>
<script>
  const s = Number(new URLSearchParams(location.search).get("s") || 128);
  const t = document.getElementById("tile");
  t.style.width = t.style.height = s + "px";
  t.style.borderRadius = Math.round(s * 0.2) + "px";
  t.querySelector("svg").style.width = t.querySelector("svg").style.height = Math.round(s * 0.66) + "px";
</script>
</body>
</html>
